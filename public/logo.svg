<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="sismikGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="100" height="100" rx="24" fill="#0c1222" stroke="#1e293b" stroke-width="2"/>

  <!-- Radar circles -->
  <circle cx="50" cy="50" r="38" stroke="#f43f5e" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="50" cy="50" r="28" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="2"/>
  <circle cx="50" cy="50" r="18" stroke="#f43f5e" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Center core with glow -->
  <circle cx="50" cy="50" r="8" fill="url(#sismikGrad)" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="3" fill="#ffffff"/>

  <!-- Pulse seismic line crossing through -->
  <path d="M14 50 H32 L38 34 L46 66 L54 30 L62 62 L68 50 H86" stroke="url(#sismikGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
